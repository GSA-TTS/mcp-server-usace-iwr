[project]
name = "mcp-server-usace-iwr"
version = "0.1.0"
description = "MCP server wrapping the USACE IWR River Mile Marker ArcGIS Feature Service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=3.4.7",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/usace_iwr_server"]
